<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Welcome, {{ username }}</h1>
        <a href="{{ url_for('logout') }}" class="btn">Log Out</a>
    </header>
    <main>
        <h2>Dashboard</h2>
        <p>Welcome to the user dashboard. You can access various features here:</p>
        <ul>
            <li><a href="{{ url_for('visualize') }}">Visualize Motor Actions</a></li>
            <li><a href="{{ url_for('start_session') }}">Start New Session</a></li>
        </ul>
    </main>
</body>
</html>
