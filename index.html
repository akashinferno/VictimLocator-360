<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VL-360</title>
    <!-- Link to CSS using Flask's url_for -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="logo">
            <h1>VL-360</h1>
        </div>
        <nav>
            <ul>
                <li><a href="#contact">Contact Us</a></li>
                <li><a href="#about">About Us</a></li>
                <li><a href="#instructions">Instructions</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
           
            <h2>Welcome to VL-360</h2>
            <div class="buttons-container">
                <button class="btn" id="start-session">Start New Session</button>
                <script> 
                    document.getElementById('start-session').addEventListener('click', () => {
                        const endpointUrl = '/start-session'; // Flask endpoint URL
                        window.location.href = endpointUrl; // Redirects to the endpoint
                    });
                </script>
                <button class="btn" id="enter-session">Enter Existing Session</button>
            </div>
        </section>
    </main>
</body>
</html>
