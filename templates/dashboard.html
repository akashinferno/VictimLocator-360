<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- Link to external styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Dashboard container styling */
        .dashboard-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Navigation styling */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #1e3c72;
            color: #fff;
        }

        header h1 {
            font-size: 1.8rem;
            margin: 0;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            display: inline-block;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #ffd700;
        }

        /* Feature list styling */
        .feature-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 0;
            justify-content: center;
            margin-top: 20px;
        }

        .feature-list li {
            background: #3498db;
            color: #fff;
            padding: 15px 20px;
            border-radius: 5px;
            font-size: 1.2em;
            text-align: center;
            transition: background-color 0.3s;
        }

        .feature-list li:hover {
            background-color: #2980b9;
        }

        .feature-list li a {
            text-decoration: none;
            color: white;
        }

        /* Footer styling */
        footer {
            background-color: rgba(30, 60, 114, 0.8);
            color: rgba(255, 255, 255, 0.8);
            width: 100%;
            padding: 10px 0;
            text-align: center;
            position: fixed;
            bottom: 0;
        }

        footer a {
            color: #ffd700;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="logo">
            <h1>Car Control Dashboard</h1>
        </div>
        <nav>
            <ul>
                <li><a href="{{ url_for('index') }}">Home</a></li>
                <li><a href="{{ url_for('visualize') }}">Visualize Data</a></li>
                <li><a href="{{ url_for('logout') }}">Log Out</a></li>
            </ul>
        </nav>
    </header>

    <!-- Dashboard Content -->
    <main class="dashboard-container">
        <h2>Welcome, {{ username }}</h2>
        <p>Explore the features available in the Car Control System:</p>
        <ul class="feature-list">
            <li><a href="{{ url_for('visualize') }}">Visualize Motor Actions</a></li>
            <li><a href="{{ url_for('start_session') }}">Start New Session</a></li>
            <li><a href="{{ url_for('index') }}">Control the Car</a></li>
        </ul>
    </main>

    <!-- Footer Section -->
    <footer>
        &copy; 2024 Victim Locator 360 - by TEAM CODE-O-PHILES | <a href="#">Privacy Policy</a>
    </footer>

    <!-- SocketIO Client Script -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = io.connect('http://localhost:5000');
        
        socket.on('control_request', (data) => {
            alert(`${data.requester} is requesting control access.`);
        });

        socket.on('control_granted', (data) => {
            alert(`Control has been transferred to ${data.new_controller}.`);
            window.location.reload();  // Refresh to update access
        });

        socket.on('control_denied', () => {
            alert("Your control request was denied.");
        });
    </script>
</body>
</html>
