<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car State Visualization</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('{{ url_for('static', filename='6869461.jpg') }}') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        h1, h2 {
            text-align: center;
            color: #318CE7;
            margin-bottom: 20px;
        }

        img {
            display: block;
            margin: 20px auto;
            max-width: 100%;
            border: 3px solid #318CE7;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            color: #007FFF; /* Azure Blue */
        }

        table th, table td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }

        table th {
            background: #318CE7;
            color: #fff;
            font-weight: bold;
        }

        table tr:nth-child(even) {
            background: #f9f9f9;
        }

        table tr:hover {
            background: #f1f1f1;
        }

        .back-to-dashboard {
            position: absolute;
            top: 10px;
            right: 20px;
        }

        footer {
            background: linear-gradient(90deg, #318CE7, #2566A3);
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        footer a {
            color: #FFD700;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Car State Visualization</h1>
        <a href="{{ url_for('index') }}" class="btn btn-primary back-to-dashboard">Back to Dashboard</a>
    </header>

    <div class="container">
        <h2>State Frequency</h2>
        <img id="freq-graph" src="data:image/png;base64,{{ freq_img_data }}" alt="Frequency Graph">

        <h2>State Changes Over Time</h2>
        <img id="time-graph" src="data:image/png;base64,{{ time_img_data }}" alt="State Changes Over Time">

        <h2>State History</h2>
        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>State</th>
                    <th>User ID</th>
                </tr>
            </thead>
            <tbody>
                {% for timestamps, state, user_id in car_data %}
                <tr>
                    <td>{{ timestamps }}</td>
                    <td>{{ state }}</td>
                    <td>{{ user_id }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <footer>
        &copy; 2024 Victim Locator 360 | <a href="#">Privacy Policy</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const socket = io.connect('http://localhost:5000');

        // Dynamically update the table and graphs on new events
        socket.on('update_graphs', (data) => {
            const { freq_img_data, time_img_data, car_data } = data;

            document.getElementById('freq-graph').src = 'data:image/png;base64,' + freq_img_data;
            document.getElementById('time-graph').src = 'data:image/png;base64,' + time_img_data;

            const tableBody = document.querySelector('table tbody');
            tableBody.innerHTML = ''; // Clear existing rows

            car_data.forEach(row => {
                const newRow = document.createElement('tr');
                newRow.innerHTML = `<td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td>`;
                tableBody.appendChild(newRow);
            });
        });
    </script>
</body>
</html>
