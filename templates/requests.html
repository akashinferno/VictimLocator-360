<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Requests</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">Control Requests</h2>
        <!-- Requests Table -->
        <table class="table table-bordered table-striped mt-4">
            <thead class="table-dark">
                <tr>
                    <th>Requester</th>
                    <th>Status</th>
                    <th>Timestamp</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for request in requests %}
                <tr>
                    <td>{{ request[1] }}</td> <!-- Requester -->
                    <td>{{ request[2] }}</td> <!-- Status -->
                    <td>{{ request[3] }}</td> <!-- Timestamp -->
                    <td>
                        {% if request[2] == 'Pending' %}
                        <!-- Accept Request -->
                        <form action="{{ url_for('update_request', request_id=request[0], action='accept') }}" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-success btn-sm">Accept</button>
                        </form>
                        <!-- Reject Request -->
                        <form action="{{ url_for('update_request', request_id=request[0], action='reject') }}" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-danger btn-sm">Reject</button>
                        </form>
                        {% else %}
                        <span class="text-muted">No actions available</span>
                        {% endif %}
                    </td>
                </tr>
                {% else %}
                <!-- No Requests Found -->
                <tr>
                    <td colspan="4" class="text-center text-muted">No control requests found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <!-- Back to Dashboard Button -->
        <a href="{{ url_for('index') }}" class="btn btn-primary">Back to Dashboard</a>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
